<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator & Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="container">
        <h1>🔐 Password Generator & Strength Checker</h1>

        <div class="section">
            <h2>Check Password Strength</h2>
            <input type="text" id="passwordInput" placeholder="Type a password to check...">
            <p id="strengthResult"></p>
        </div>

        <div class="section">
            <h2>Generate a Strong Password</h2>
            
            <label>
                Length: <span id="lengthValue">12</span>
                <input type="range" id="lengthSlider" min="6" max="32" value="12">
            </label>

            <label>
                <input type="checkbox" id="includeUppercase" checked> Include Uppercase (A-Z)
            </label>
            <label>
                <input type="checkbox" id="includeNumbers" checked> Include Numbers (0-9)
            </label>
            <label>
                <input type="checkbox" id="includeSymbols" checked> Include Symbols (!@#$)
            </label>

            <button id="generateBtn">Generate Password</button>

            <div id="generatedPasswordBox">
                <span id="generatedPassword"></span>
                <button id="copyBtn">Copy</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
